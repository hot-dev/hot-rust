[package]
name = "hot-dev"
version = "1.2.0"
edition = "2021"
rust-version = "1.86"
description = "Official Rust SDK for the Hot Dev API"
license = "Apache-2.0"
repository = "https://github.com/hot-dev/hot-rust"
homepage = "https://hot.dev"
documentation = "https://docs.rs/hot-dev"
readme = "README.md"
keywords = ["hot", "sdk", "api", "events", "sse"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
async-stream = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "stream",
] }
# Enforce security floors for reqwest's TLS stack in consuming applications,
# which resolve their own dependencies rather than using this repo's lockfile.
rustls = { version = "0.23.46", default-features = false }
rustls-webpki = { version = "0.103.16", default-features = false }
webpki-roots = "1.0.10"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
