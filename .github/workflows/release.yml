name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: Validate release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          TAG_NAME="v${VERSION}"
          if [[ "$REF_NAME" != "$TAG_NAME" ]]; then
            echo "::error::Tag ${REF_NAME} does not match Cargo.toml version (${TAG_NAME})"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories

      # Requires the trusted publisher to be configured on the crate's
      # crates.io settings (repo hot-dev/hot-rust, workflow release.yml,
      # environment crates-io).
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
